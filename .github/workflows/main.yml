}

// ───────────────────────── Notes ─────────────────────────
class NotesPage extends StatefulWidget {
  const NotesPage({super.key});
  @override
  State<NotesPage> createState() => _NotesState();
}

class _NotesState extends State<NotesPage> {
  List<Map<String, dynamic>> notes = [];
  String q = '';

  @override
  void initState() {
    super.initState();
    final s = prefs.getString('notes');
    if (s != null) notes = (jsonDecode(s) as List).map((e) => Map<String, dynamic>.from(e)).toList();
  }

  void _save() => prefs.setString('notes', jsonEncode(notes));

  Future<void> _edit([Map<String, dynamic>? n]) async {
    final t = TextEditingController(text: n?['t'] ?? '');
    final b = TextEditingController(text: n?['b'] ?? '');
    await Navigator.push(
      context,
      MaterialPageRoute(
        builder: (c) => Scaffold(
          appBar: AppBar(
            title: Text(n == null ? 'Nouvelle note' : 'Modifier'),
            actions: [IconButton(icon: const Icon(Icons.check), onPressed: () => Navigator.pop(c))],
          ),
          body: Padding(
            padding: const EdgeInsets.all(16),
            child: Column(children: [
              TextField(
                controller: t,
                style: const TextStyle(fontSize: 22, fontWeight: FontWeight.w700),
                decoration: const InputDecoration(hintText: 'Titre', border: InputBorder.none),
              ),
              Expanded(
                child: TextField(
                  controller: b,
                  maxLines: null,
                  expands: true,
                  textAlignVertical: TextAlignVertical.top,
                  decoration: const InputDecoration(hintText: 'Écris ici...', border: InputBorder.none),
                ),
              ),
            ]),
          ),
        ),
      ),
    );
    final empty = t.text.trim().isEmpty && b.text.trim().isEmpty;
    setState(() {
      if (n == null) {
        if (!empty) notes.insert(0, {'id': DateTime.now().microsecondsSinceEpoch, 't': t.text.trim(), 'b': b.text.trim(), 'ts': DateTime.now().millisecondsSinceEpoch});
      } else if (empty) {
        notes.remove(n);
      } else {
        n['t'] = t.text.trim();
        n['b'] = b.text.trim();
        n['ts'] = DateTime.now().millisecondsSinceEpoch;
        notes.remove(n);
        notes.insert(0, n);
      }
    });
    _save();
  }

  @override
  Widget build(BuildContext context) {
    final cs = Theme.of(context).colorScheme;
    final list = notes.where((n) => q.isEmpty || '${n['t']} ${n['b']}'.toLowerCase().contains(q.toLowerCase())).toList();
    return Scaffold(
      appBar: AppBar(title: const Text('Blocs notes')),
      floatingActionButton: FloatingActionButton.extended(onPressed: () => _edit(), icon: const Icon(Icons.add), label: const Text('Note')),
      body: Column(children: [
        Padding(
          padding: const EdgeInsets.fromLTRB(16, 8, 16, 8),
          child: TextField(
            onChanged: (v) => setState(() => q = v.trim()),
            decoration: InputDecoration(
              prefixIcon: const Icon(Icons.search),
              hintText: 'Chercher dans mes notes',
              filled: true,
              border: OutlineInputBorder(borderRadius: BorderRadius.circular(28), borderSide: BorderSide.none),
            ),
          ),
        ),
        Expanded(
          child: list.isEmpty
              ? Center(child: Text('Aucune note', style: TextStyle(color: cs.onSurfaceVariant)))
              : ListView.builder(
                  padding: const EdgeInsets.fromLTRB(16, 0, 16, 90),
                  itemCount: list.length,
                  itemBuilder: (c, i) {
                    final n = list[i];
                    final d = DateTime.fromMillisecondsSinceEpoch(n['ts'] as int);
                    return Dismissible(
                      key: ValueKey(n['id']),
                      background: Container(
                        margin: const EdgeInsets.only(bottom: 10),
                        decoration: BoxDecoration(color: Colors.red.shade400, borderRadius: BorderRadius.circular(18)),
                        alignment: Alignment.centerRight,
                        padding: const EdgeInsets.only(right: 20),
                        child: const Icon(Icons.delete, color: Colors.white),
                      ),
                      direction: DismissDirection.endToStart,
                      onDismissed: (_) {
                        setState(() => notes.remove(n));
                        _save();
                      },
                      child: GestureDetector(
                        onTap: () => _edit(n),
                        child: Container(
                          width: double.infinity,
                          margin: const EdgeInsets.only(bottom: 10),
                          padding: const EdgeInsets.all(16),
                          decoration: BoxDecoration(color: cs.surfaceContainerHighest, borderRadius: BorderRadius.circular(18)),
                          child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                            if ((n['t'] as String).isNotEmpty) Text(n['t'], style: const TextStyle(fontSize: 17, fontWeight: FontWeight.w700)),
                            if ((n['b'] as String).isNotEmpty) Padding(padding: const EdgeInsets.only(top: 4), child: Text(n['b'], maxLines: 3, overflow: TextOverflow.ellipsis)),
                            const SizedBox(height: 8),
                            Text('${d.day}/${d.month}/${d.year}', style: TextStyle(fontSize: 11, color: cs.onSurfaceVariant)),
                          ]),
                        ),
                      ),
                    );
                  },
                ),
        ),
      ]),
    );
  }
}

// ───────────────────────── Réglages ─────────────────────────
class SettingsPage extends StatefulWidget {
  const SettingsPage({super.key});
  @override
  State<SettingsPage> createState() => _SettingsState();
}

class _SettingsState extends State<SettingsPage> {
  final nameCtl = TextEditingController(text: S.name);

  Widget _label(String t) => Padding(
        padding: const EdgeInsets.only(top: 22, bottom: 8),
        child: Text(t, style: const TextStyle(fontWeight: FontWeight.w700)),
      );

  @override
  Widget build(BuildContext context) {
    return ListenableBuilder(
      listenable: S,
      builder: (context, _) => Scaffold(
        appBar: AppBar(title: const Text('Réglages')),
        body: ListView(padding: const EdgeInsets.all(18), children: [
          _label('Mon prénom'),
          TextField(
            controller: nameCtl,
            onChanged: (v) {
              S.name = v.trim();
              S.save();
            },
            decoration: InputDecoration(hintText: 'Pour le message d\'accueil', filled: true, border: OutlineInputBorder(borderRadius: BorderRadius.circular(16), borderSide: BorderSide.none)),
          ),
          _label('Thème'),
          SizedBox(
            width: double.infinity,
            child: SegmentedButton<int>(
              segments: const [
                ButtonSegment(value: 0, label: Text('Auto')),
                ButtonSegment(value: 1, label: Text('Clair')),
                ButtonSegment(value: 2, label: Text('Sombre')),
              ],
              selected: {S.theme},
              onSelectionChanged: (s) {
                S.theme = s.first;
                S.save();
              },
            ),
          ),
          _label('Couleur de l\'application'),
          Wrap(spacing: 12, children: [
            for (final c in accents)
              GestureDetector(
                onTap: () {
                  S.accent = c;
                  S.save();
                },
                child: Container(
                  width: 44,
                  height: 44,
                  decoration: BoxDecoration(
                    color: Color(c),
                    shape: BoxShape.circle,
                    border: S.accent == c ? Border.all(color: Theme.of(context).colorScheme.onSurface, width: 3) : null,
                  ),
                  child: S.accent == c ? const Icon(Icons.check, color: Colors.white) : null,
                ),
              ),
          ]),
          _label('Ville (heures de prière)'),
          DropdownButtonFormField<String>(
            value: S.city,
            decoration: InputDecoration(filled: true, border: OutlineInputBorder(borderRadius: BorderRadius.circular(16), borderSide: BorderSide.none)),
            items: [for (final c in cities) DropdownMenuItem(value: c, child: Text(c))],
            onChanged: (v) {
              if (v != null) {
                S.city = v;
                S.save();
              }
            },
          ),
          _label('Récitant du Coran'),
          DropdownButtonFormField<String>(
            value: S.reciter,
            decoration: InputDecoration(filled: true, border: OutlineInputBorder(borderRadius: BorderRadius.circular(16), borderSide: BorderSide.none)),
            items: [for (final e in reciters.entries) DropdownMenuItem(value: e.value, child: Text(e.key))],
            onChanged: (v) {
              if (v != null) {
                S.reciter = v;
                S.save();
              }
            },
          ),
          _label('Taille du texte arabe'),
          Slider(
            value: S.quranSize,
            min: 20,
            max: 40,
            divisions: 10,
            label: '${S.quranSize.round()}',
            onChanged: (v) {
              S.quranSize = v;
              S.save();
            },
          ),
          Directionality(textDirection: TextDirection.rtl, child: Text('بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', style: TextStyle(fontSize: S.quranSize), textAlign: TextAlign.center)),
          const SizedBox(height: 30),
          Center(child: Text('Mon Hub · v2', style: TextStyle(fontSize: 12, color: Theme.of(context).colorScheme.onSurfaceVariant))),
        ]),
      ),
    );
  }
}
